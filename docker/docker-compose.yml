services:
  postgres:
    image: postgres:16-alpine
    container_name: dsms-postgres
    restart: always
    environment:
      POSTGRES_DB: dsms_db
      POSTGRES_USER: dsms_user
      POSTGRES_PASSWORD: dsms_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - dsms-postgres-data:/var/lib/postgresql/data
    
    ports:
      - "5432:5432"
    networks:
      - dsms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsms_user -d dsms_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: dsms-redis
    restart: always
    volumes:
      - dsms-redis-data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - dsms-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dsms_redis_password", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 前端构建服务
  frontend-build:
    image: node:20-alpine
    container_name: dsms-frontend-build
    working_dir: /app
    volumes:
      - ../dsms_view:/app
    command: sh -c "npm install && npm run build"
    networks:
      - dsms-network
    profiles:
      - build

  nginx:
    image: nginx:1.25-alpine
    container_name: dsms-nginx
    restart: always
    ports:
      - "80:80"
    networks:
      - dsms-network
    volumes:
      # 挂载前端静态文件
      - ../dsms_view/dist:/usr/share/nginx/html
      # 挂载自定义 Nginx 配置
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - postgres
      - redis

networks:
  dsms-network:
    driver: bridge

volumes:
  dsms-postgres-data:
  dsms-redis-data:
