
services:
  postgres:
    image: postgres:16-alpine
    container_name: dsms-postgres
    restart: always
    environment:
      POSTGRES_DB: dsms_db
      POSTGRES_USER: dsms_user
      POSTGRES_PASSWORD: dsms_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
    
    ports:
      - "5432:5432"
    networks:
      - dsms-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dsms_user -d dsms_db"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: dsms-redis
    restart: always
    volumes:
      - ./redis/data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    ports:
      - "6379:6379"
    networks:
      - dsms-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dsms_redis_password", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:1.25-alpine
    container_name: dsms-nginx
    restart: always
    ports:
      - "80:80"
    networks:
      - dsms-network
    depends_on:
      - postgres
      - redis

networks:
  dsms-network:
    driver: bridge
